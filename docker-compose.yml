services:

  server:
    image: szurubooru/server:latest
    depends_on:
      - sql
    environment:
      POSTGRES_HOST: sql
      POSTGRES_USER: szuru
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - "D:/szuru_master/data:/data"
      - "D:/szuru/config.yaml:/opt/app/config.yaml"

  client:
    image: szurubooru/client:latest
    depends_on:
      - server
    environment:
      BACKEND_HOST: server
      # Set BASE_URL to your public domain so frontend links render properly
      BASE_URL: "${BASE_URL:?Set BASE_URL in .env}"
    volumes:
      - "D:/szuru_master/data:/data:ro"
    ports:
      - "8080:80"

  sql:
    image: postgres:11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: szuru
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - "D:/szuru_master/db:/var/lib/postgresql/data"

  # --- CLOUDFLARE TUNNEL SERVICE ---
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:?Set TUNNEL_TOKEN in .env}"
    depends_on:
      - client